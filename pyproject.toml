[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotci"
version = "0.0.1"
description = "Local-first regression testing for ROS2/Nav2"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "RobotCI Team" }
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
robotci = "robotci.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["robotci"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]