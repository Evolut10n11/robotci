[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotci"
version = "0.1.0a1"
description = "Deterministic robot behavior regression testing for ROS2/Nav2"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "RobotCI Team" }
]
keywords = ["robotics", "ros2", "nav2", "ci", "regression-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3.0",
]
dev = [
    "mcp>=2.0,<3.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[project.urls]
Homepage = "https://github.com/Evolut10n11/robotci"
Repository = "https://github.com/Evolut10n11/robotci"
Issues = "https://github.com/Evolut10n11/robotci/issues"

[project.scripts]
robotci = "robotci.bootstrap:main"
robotci-init = "robotci.init_cli:app"
robotci-baseline = "robotci.baseline_cli:app"
robotci-suite-gate = "robotci.suite_cli:app"
robotci-doctor = "robotci.doctor_report:main"
robotci-mcp = "robotci.mcp.server:main"
robotci-support-bundle = "robotci.support_bundle:main"

[tool.hatch.build.targets.wheel]
packages = ["robotci"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
