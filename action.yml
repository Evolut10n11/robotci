name: RobotCI Regression Gate
description: Fail a GitHub Actions job when RobotCI detects a navigation regression.
author: RobotCI Team

branding:
  icon: activity
  color: blue

inputs:
  baseline:
    description: Path to the known-good RobotCI scenario result JSON.
    required: true
  candidate:
    description: Path to the candidate RobotCI scenario result JSON.
    required: true
  report:
    description: Path where the machine-readable regression report will be written.
    required: false
    default: artifacts/regression-report.json
  max-duration-increase-pct:
    description: Maximum allowed duration increase in percent.
    required: false
    default: "10"
  max-path-length-increase-pct:
    description: Maximum allowed path-length increase in percent.
    required: false
    default: "10"
  max-stuck-events-increase:
    description: Maximum allowed additional stuck events.
    required: false
    default: "0"
  max-recoveries-increase:
    description: Maximum allowed additional recoveries.
    required: false
    default: "0"

outputs:
  report:
    description: Path to the generated machine-readable regression report.
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install RobotCI
      shell: bash
      run: python -m pip install "${{ github.action_path }}"

    - name: Compare candidate with baseline
      id: gate
      shell: bash
      env:
        ROBOTCI_BASELINE: ${{ inputs.baseline }}
        ROBOTCI_CANDIDATE: ${{ inputs.candidate }}
        ROBOTCI_REPORT: ${{ inputs.report }}
        ROBOTCI_MAX_DURATION: ${{ inputs.max-duration-increase-pct }}
        ROBOTCI_MAX_PATH: ${{ inputs.max-path-length-increase-pct }}
        ROBOTCI_MAX_STUCK: ${{ inputs.max-stuck-events-increase }}
        ROBOTCI_MAX_RECOVERIES: ${{ inputs.max-recoveries-increase }}
      run: |
        robotci compare \
          --baseline "$ROBOTCI_BASELINE" \
          --candidate "$ROBOTCI_CANDIDATE" \
          --output "$ROBOTCI_REPORT" \
          --max-duration-increase-pct "$ROBOTCI_MAX_DURATION" \
          --max-path-length-increase-pct "$ROBOTCI_MAX_PATH" \
          --max-stuck-events-increase "$ROBOTCI_MAX_STUCK" \
          --max-recoveries-increase "$ROBOTCI_MAX_RECOVERIES"
        echo "report=$ROBOTCI_REPORT" >> "$GITHUB_OUTPUT"
