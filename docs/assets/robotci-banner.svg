<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">RobotCI</title>
  <desc id="description">Measure behavior. Gate regressions. Deterministic regression testing for ROS 2 and Nav2. Abstract baseline and candidate routes illustrate behavior comparison.</desc>
