    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1325"/>
      <stop offset="1" stop-color="#14263b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7292ad" stroke-opacity=".1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#background)"/>
  <rect x="742" width="538" height="400" rx="20" fill="url(#grid)"/>
  <path d="M742 40V360" stroke="#2c4156"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
