name: ROS smoke

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "AGENTS.md"
      - ".agent/**"
      - "web/**"
      - "robotci/baseline_cli.py"
      - "robotci/baselines.py"
      - "robotci/init_cli.py"
      - "robotci/scaffold.py"
      - "robotci/comparison.py"
      - "robotci/regression.py"
      - "robotci/suite_cli.py"
      - "robotci/suite_comparison.py"
      - "robotci/suite_reporting.py"
      - "tests/test_baseline*.py"
      - "tests/test_init_cli.py"
      - "tests/test_scaffold.py"
      - "tests/test_comparison.py"
      - "tests/test_regression.py"
      - "tests/test_suite*.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ros-smoke:
    name: ROS2 Jazzy + Nav2 smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ROS2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Nav2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-navigation2 \
            ros-jazzy-nav2-bringup \
            ros-jazzy-nav2-loopback-sim \
            ros-jazzy-nav2-simple-commander

      - name: Verify ROS2 and Nav2 packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          echo "ROS_DISTRO=$ROS_DISTRO"
          ros2 --help >/dev/null
          ros2 pkg prefix nav2_bringup
          ros2 pkg prefix nav2_loopback_sim
          ros2 pkg prefix nav2_simple_commander

      - name: Verify Nav2 Python API
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 - <<'PY'
          from nav2_simple_commander.robot_navigator import BasicNavigator
          print("BasicNavigator import: PASS")
          PY
