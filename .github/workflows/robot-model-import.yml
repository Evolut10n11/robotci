name: Robot Model Import Acceptance
on:
  pull_request:
    paths:
      - 'robotci/model_import.py'
      - 'robotci/model_catalog/**'
      - 'robotci/viewer*.py'
      - 'robotci/config.py'
      - 'robotci/runner.py'
      - 'web/**'
      - 'scripts/*robot_catalog.py'
      - 'tests/test_model_import.py'
      - 'experiments/robot_models/import_acceptance.py'
      - '.github/workflows/robot-model-import.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/mujoco_menagerie
          ref: 0059d4335f8156206f63a35662313385f7ad6d74
          path: artifacts/model-source
          persist-credentials: false
          sparse-checkout: |
            unitree_go2
            unitree_g1
            franka_emika_panda
      - name: Install isolated acceptance dependencies
        run: |
          python -m pip install -e '.[dev]' mujoco==3.3.7 numpy==2.2.6 playwright==1.55.0 build
          python -m playwright install --with-deps chromium
          npm ci --no-audit --no-fund --prefix web
      - name: Tests and shipped asset parity
        run: |
          python -m ruff check .
          python -m pytest -q tests/test_model_import.py tests/test_robot_visual_profiles.py tests/test_viewer.py tests/test_viewer_session.py
          npm test --prefix web
          npm run build --prefix web
          git diff --exit-code -- robotci/viewer_assets
      - name: Verify real reference kinematics
        run: python scripts/verify_robot_catalog.py --source artifacts/model-source --catalog robotci/model_catalog --output artifacts/import-acceptance/kinematics.json
      - name: Browser import and local-file isolation
        run: python experiments/robot_models/import_acceptance.py --source artifacts/model-source --output artifacts/import-acceptance/browser
      - name: Verify wheel includes model geometry and licenses
        run: |
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              for model in ('unitree_go2', 'unitree_g1', 'franka_emika_panda'):
                  for suffix in ('json', 'glb.gz', 'LICENSE'):
                      assert f'robotci/model_catalog/{model}.{suffix}' in wheel.namelist()
          PY
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-model-import-acceptance
          path: artifacts/import-acceptance/
          retention-days: 30
          if-no-files-found: warn
