# Temporary feature-branch verification; removed before the final pull request.
name: Robot Import Development Snapshot
on:
  push:
    branches: [feat/robot-description-import]
    paths: [.github/workflows/robot-import-dev.yml]
permissions:
  contents: write
concurrency:
  group: robot-import-development
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'Evolut10n11/robotci' && github.ref == 'refs/heads/feat/robot-description-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Separate imported models from conditional profile selection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/main.js')
          text = path.read_text()
          old = 'aria-pressed="${selected === id}"'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'aria-pressed="${!imported && selected === id}"'))
          path = Path('experiments/robot_models/import_acceptance.py')
          text = path.read_text()
          old = '            page.locator("#focus-button").click()'
          assert text.count(old) == 1
          new = '''            expect(page.locator('.profile-card[aria-pressed="true"]')).to_have_count(0)
                      report["checks"].append("imported model is distinct from conditional profiles")
                      page.locator("#focus-button").click()'''
          new = new.replace('\n                      ', '\n            ')
          path.write_text(text.replace(old, new))
          PY
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/mujoco_menagerie
          ref: 0059d4335f8156206f63a35662313385f7ad6d74
          path: artifacts/model-source
          persist-credentials: false
          sparse-checkout: |
            unitree_go2
            unitree_g1
            franka_emika_panda
      - name: Install isolated acceptance dependencies
        run: |
          python -m pip install -e '.[dev]' mujoco==3.3.7 numpy==2.2.6 playwright==1.55.0 build
          npm ci --no-audit --no-fund --prefix web
          python -m playwright install --with-deps chromium
      - name: Lint and rebuild shipped UI
        run: |
          python -m ruff format experiments/robot_models/import_acceptance.py
          python -m ruff check .
          npm run build --prefix web
      - name: Verify reference frames and regression tests
        run: |
          python scripts/verify_robot_catalog.py --source artifacts/model-source --catalog robotci/model_catalog --output artifacts/import-acceptance/kinematics.json
          python -m pytest -q tests/test_model_import.py tests/test_robot_visual_profiles.py tests/test_config.py tests/test_viewer.py tests/test_viewer_session.py tests/test_runner_replay.py tests/test_runner.py
          npm test --prefix web
      - name: Exercise real browser model import
        run: python experiments/robot_models/import_acceptance.py --source artifacts/model-source --output artifacts/import-acceptance/browser
      - name: Verify wheel model inclusion
        run: |
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              for model in ('unitree_go2', 'unitree_g1', 'franka_emika_panda'):
                  for suffix in ('json', 'glb.gz', 'LICENSE'):
                      assert f'robotci/model_catalog/{model}.{suffix}' in wheel.namelist()
          PY
      - name: Preserve source and evidence for review
        if: always()
        run: |
          mkdir -p artifacts/import-review
          git diff --stat > artifacts/import-review/diff-stat.txt
          git rev-parse HEAD > artifacts/import-review/base-commit.txt
          tar --exclude='./.git' --exclude='./artifacts' --exclude='./web/node_modules' --exclude='./dist' --exclude='./.pytest_cache' --exclude='./.ruff_cache' --exclude='__pycache__' -czf artifacts/import-review/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-import-prepared
          path: |
            artifacts/import-review/
            artifacts/import-acceptance/
          retention-days: 14
          if-no-files-found: error
      - name: Publish verified source to the same feature branch only
        run: |
          git fetch origin feat/robot-description-import
          test "$(git rev-parse origin/feat/robot-description-import)" = "$GITHUB_SHA"
          git add web/src/main.js robotci/viewer_assets experiments/robot_models/import_acceptance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: distinguish imported robot from generic visual profiles'
          git push origin HEAD:refs/heads/feat/robot-description-import
