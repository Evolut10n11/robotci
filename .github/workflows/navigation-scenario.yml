name: Navigation Scenario

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  simple-route:
    name: A to B / simple_route
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ROS2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Nav2 Loopback runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            ros-jazzy-navigation2 \
            ros-jazzy-nav2-bringup \
            ros-jazzy-nav2-loopback-sim \
            ros-jazzy-nav2-simple-commander \
            ros-jazzy-nav2-minimal-tb4-description

      - name: Install RobotCI CLI into ROS Python
        run: |
          python3 -m pip install --break-system-packages -e .
          python3 -m robotci.cli --help

      - name: Run RobotCI simple_route through CLI
        env:
          ROBOTCI_LOG_FILE: /tmp/nav2-simple-route.log
        run: |
          python3 -m robotci.cli run \
            --runtime native \
            --scenario simple_route \
            --output artifacts/simple-route/result.json \
            --timeout-sec 120

      - name: Upload scenario result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-route-result
          path: artifacts/simple-route/result.json
          if-no-files-found: warn

      - name: Upload Nav2 log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simple-route-nav2-log
          path: /tmp/nav2-simple-route.log
          if-no-files-found: ignore
