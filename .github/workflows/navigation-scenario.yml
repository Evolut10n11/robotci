name: Navigation Suite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  suite:
    name: Native Ubuntu / built-in suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ROS2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install Nav2 Loopback runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            ros-jazzy-navigation2 \
            ros-jazzy-nav2-bringup \
            ros-jazzy-nav2-loopback-sim \
            ros-jazzy-nav2-simple-commander \
            ros-jazzy-nav2-minimal-tb4-description

      - name: Install RobotCI CLI into ROS Python
        run: |
          python3 -m pip install --break-system-packages -e .
          python3 -m robotci.cli --help

      - name: Run built-in RobotCI suite through CLI
        run: |
          python3 -m robotci.cli run \
            --runtime native \
            --output artifacts/suite-result.json \
            --timeout-sec 120

      - name: Verify suite result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/suite-result.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          names = [item["scenario"] for item in result["scenarios"]]

          if result["status"] != "PASS":
              raise SystemExit(f"Navigation suite did not PASS: {result}")
          if names != ["short_route", "medium_route", "simple_route"]:
              raise SystemExit(f"Unexpected suite scenarios: {names}")

          print(f"Navigation suite PASS: {names}")
          PY

      - name: Upload suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-suite-results
          path: |
            artifacts/suite-result.json
            artifacts/results/*.json
          if-no-files-found: warn

      - name: Upload Nav2 logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-suite-nav2-logs
          path: /tmp/nav2-*.log
          if-no-files-found: ignore
