name: Docker Runtime

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-suite:
    name: Docker / YAML suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RobotCI image
        run: docker build -t robotci:ci .

      - name: Run YAML suite in Docker
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD/artifacts:/workspace/artifacts" \
            robotci:ci

      - name: Verify Docker suite result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          suite = json.loads(Path("artifacts/suite-result.json").read_text(encoding="utf-8"))
          names = [item["scenario"] for item in suite["scenarios"]]

          if suite["status"] != "PASS":
              raise SystemExit(f"Docker suite did not PASS: {suite}")
          if names != ["short_route", "medium_route", "simple_route"]:
              raise SystemExit(f"Unexpected Docker suite scenarios: {names}")

          expected = {
              "short_route": (4.0, -0.17),
              "medium_route": (9.0, -0.39),
              "simple_route": (17.86, -0.77),
          }
          for name, goal in expected.items():
              result = json.loads(
                  Path(f"artifacts/results/{name}.json").read_text(encoding="utf-8")
              )
              actual = (result["goal"]["x"], result["goal"]["y"])
              if actual != goal:
                  raise SystemExit(f"{name} did not use YAML goal {goal}: {actual}")

          print(f"Docker YAML suite PASS: {names}")
          PY

      - name: Upload Docker suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-suite-results
          path: |
            artifacts/suite-result.json
            artifacts/results/*.json
          if-no-files-found: warn
