name: Regression Gate Action

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  action-smoke:
    name: Composite action smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Passing candidate stays green
        id: passing
        uses: ./
        with:
          baseline: tests/fixtures/gate-baseline.json
          candidate: tests/fixtures/gate-candidate-pass.json
          report: artifacts/pass-report.json

      - name: Verify passing report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("${{ steps.passing.outputs.report }}")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == 1
          assert report["status"] == "PASS"
          print(f"PASS report verified: {path}")
          PY

      - name: Regressing candidate fails the gate
        id: regression
        continue-on-error: true
        uses: ./
        with:
          baseline: tests/fixtures/gate-baseline.json
          candidate: tests/fixtures/gate-candidate-regression.json
          report: artifacts/regression-report.json

      - name: Verify regression was blocked and reported
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.regression.outcome }}" != "failure" ]; then
            echo "Expected regression gate to fail, got: ${{ steps.regression.outcome }}"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/regression-report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == 1
          assert report["status"] == "REGRESSION"
          assert report["findings"]
          print(f"Regression correctly blocked: {path}")
          PY

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-smoke-reports
          path: artifacts/*.json
          if-no-files-found: error
