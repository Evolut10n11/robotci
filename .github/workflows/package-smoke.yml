name: Package Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "robotci/**"
      - "examples/**"
      - "tests/test_version.py"
      - "tests/test_public_alpha_examples.py"
      - ".github/workflows/package-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "robotci/**"
      - "examples/**"
      - "tests/test_version.py"
      - "tests/test_public_alpha_examples.py"
      - ".github/workflows/package-smoke.yml"
  workflow_dispatch:

jobs:
  wheel:
    name: Build and install public alpha wheel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist
          test -f dist/robotci-0.1.0a1-py3-none-any.whl

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/robotci-0.1.0a1-py3-none-any.whl

      - name: Verify packaged CLI and public example
        shell: bash
        run: |
          test "$(.wheel-smoke/bin/robotci version)" = "RobotCI 0.1.0a1"
          .wheel-smoke/bin/robotci validate --config examples/nav2-loopback/robotci.yaml
          .wheel-smoke/bin/robotci plan --config examples/nav2-loopback/robotci.yaml
          .wheel-smoke/bin/robotci-init --help
          .wheel-smoke/bin/robotci-baseline --help
          .wheel-smoke/bin/robotci-support-bundle --help

      - name: Upload public alpha wheel
        uses: actions/upload-artifact@v4
        with:
          name: robotci-0.1.0a1-wheel
          path: dist/robotci-0.1.0a1-py3-none-any.whl
          if-no-files-found: error
          retention-days: 14
