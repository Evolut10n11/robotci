name: LeRobot PushT CPU Acceptance

# Explicit only: this downloads a 1.05 GB public checkpoint and optional ML packages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: CPU PushT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Checkout RobotCI
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            experiments/lerobot_pusht/requirements.txt
      - name: Record environment before dependency installation
        shell: python
        run: |
          import json
          import platform
          from pathlib import Path
          target = Path("artifacts/lerobot-pusht")
          target.mkdir(parents=True)
          (target / "environment.json").write_text(json.dumps({
              "python": platform.python_version(),
              "platform": platform.platform(),
          }, indent=2), encoding="utf-8")
      - name: Install RobotCI core
        run: python -m pip install -e .
      - name: Install pinned optional CPU runtime
        run: python -m pip install -r experiments/lerobot_pusht/requirements.txt
      - name: Fetch and verify the pinned official checkpoint
        run: python -m robotci.bootstrap lerobot fetch .robotci/checkpoints/diffusion-pusht
      - name: Run trained-policy baseline
        run: python -m robotci.bootstrap lerobot run .robotci/checkpoints/diffusion-pusht --output artifacts/lerobot-pusht/baseline --seed 1000 --max-steps 300 --inference-steps 10 --threads 1 --action-scale 1
      - name: Repeat baseline with the same seed
        run: python -m robotci.bootstrap lerobot run .robotci/checkpoints/diffusion-pusht --output artifacts/lerobot-pusht/unchanged --seed 1000 --max-steps 300 --inference-steps 10 --threads 1 --action-scale 1
      - name: Run controlled action degradation
        run: python -m robotci.bootstrap lerobot run .robotci/checkpoints/diffusion-pusht --output artifacts/lerobot-pusht/degraded --seed 1000 --max-steps 300 --inference-steps 10 --threads 1 --action-scale 0
      - name: Verify evidence, repeatability and expected regression
        if: always()
        run: python scripts/verify_lerobot_pusht.py --baseline artifacts/lerobot-pusht/baseline --unchanged artifacts/lerobot-pusht/unchanged --degraded artifacts/lerobot-pusht/degraded --output artifacts/lerobot-pusht/acceptance
      - name: Upload results and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lerobot-pusht-${{ matrix.os }}
          path: artifacts/lerobot-pusht/
          if-no-files-found: warn
          retention-days: 14
