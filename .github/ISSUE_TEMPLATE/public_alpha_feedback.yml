name: Public alpha pilot feedback
description: Share what happened when you tried RobotCI on a real ROS2/Nav2 repository.
title: "[pilot] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This form is for product evidence, including unsuccessful attempts. Do not include source code, credentials, private repository URLs, customer data, or other sensitive information.

  - type: input
    id: version
    attributes:
      label: RobotCI version
      description: Paste the output of robotci version.
    validations:
      required: true

  - type: dropdown
    id: repository_visibility
    attributes:
      label: Target repository
      options:
        - Public repository
        - Private repository
        - Internal company repository
        - Local experiment
    validations:
      required: true

  - type: dropdown
    id: project_origin
    attributes:
      label: Whose navigation workflow did you test?
      options:
        - Our team's own ROS2/Nav2 project
        - RobotCI example or tutorial only
        - Independent test of another public project
    validations:
      required: true

  - type: input
    id: setup_minutes
    attributes:
      label: Active setup time in minutes
      description: Optional. Time to the first useful result or blocker, excluding waiting. Leave blank if unknown.

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime path attempted
      options:
        - Ubuntu 24.04 native ROS2/Nav2
        - Docker
        - GitHub Actions
        - Core tooling only
        - Other
    validations:
      required: true

  - type: input
    id: scenarios
    attributes:
      label: Number of real scenarios attempted
      description: Enter the number of scenarios you configured or ran.
    validations:
      required: true

  - type: checkboxes
    id: completed
    attributes:
      label: What did you complete?
      options:
        - label: Created or adapted robotci.yaml
        - label: Passed robotci validate and robotci plan
        - label: Passed robotci doctor for the intended runtime
        - label: Ran at least one real simulation scenario
        - label: Completed a full suite
        - label: Captured a baseline
        - label: Compared a candidate with a baseline
        - label: Used the GitHub pull-request gate

  - type: dropdown
    id: gate_outcome
    attributes:
      label: Candidate gate outcome
      description: Input/compatibility errors are not completed behavior comparisons.
      options:
        - Not run
        - PASS on a real code or configuration change
        - REGRESSION on a real code or configuration change
        - Robot behavior FAIL or TIMEOUT before a completed comparison
        - INFRA_ERROR or incompatible/invalid input
        - Demo or synthetic comparison only
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence and real change
      description: Optional. Give the observation date, a safe session-note ID or approved public report URL, and the kind of code/config change. Do not share private paths or source code.

  - type: dropdown
    id: replay
    attributes:
      label: Replay usefulness
      options:
        - Not evaluated or not applicable
        - Helped explain the result
        - Tried but did not help
        - Could not open or use replay

  - type: textarea
    id: friction
    attributes:
      label: Biggest friction
      description: What was confusing, slow, broken, or too manual?
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: What was useful?
      description: Describe the point, if any, where RobotCI saved time or gave information your current workflow does not.
    validations:
      required: true

  - type: dropdown
    id: reuse
    attributes:
      label: Would you use RobotCI again in normal development?
      options:
        - "Yes"
        - "Maybe"
        - "No"
    validations:
      required: true

  - type: checkboxes
    id: actual_reuse
    attributes:
      label: Observed reuse
      options:
        - label: We ran RobotCI again in normal development without assistance from the RobotCI team.

  - type: checkboxes
    id: team_needs
    attributes:
      label: Team features you would actively want
      options:
        - label: Persistent baseline/history storage
        - label: Historical metric trends
        - label: GitHub PR reports
        - label: Team policy gates
        - label: Flaky-run detection
        - label: Private artifact/replay retention
        - label: Self-hosted enterprise deployment
        - label: Commercial support

  - type: dropdown
    id: paid_discussion
    attributes:
      label: Would you discuss a paid pilot for a concrete team capability after this trial?
      description: Feature interest alone is different from willingness to discuss a paid pilot. This is not a purchase commitment.
      options:
        - "Yes, for a specific capability described below"
        - "No"
        - "Not decided or not discussed"
        - "Not applicable; we have not used RobotCI on our own project"
    validations:
      required: true

  - type: textarea
    id: payment_signal
    attributes:
      label: Paid-signal context
      description: Optional. If any team feature would justify budget or a procurement discussion, explain which problem it would solve.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include credentials, private source code, private repository URLs, customer data, or other sensitive information.
          required: true
